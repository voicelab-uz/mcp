name: AI PR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Ignore title/description edits; a base-branch change needs a fresh review.
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # SECURITY: Only run the reviewer from the repository's default branch.
      # Never check out, import, build, test, or install dependencies from the PR.
      - name: Check out trusted reviewer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/ai-review

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Review changed code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWER_AI: ${{ secrets.REVIEWER_AI }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node .github/ai-review/review.mjs
